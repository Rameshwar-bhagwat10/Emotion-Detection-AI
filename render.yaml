services:
  - type: web
    name: emotion-detection-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/emotion_detection.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
