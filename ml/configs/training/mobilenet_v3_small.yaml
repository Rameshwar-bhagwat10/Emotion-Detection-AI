# MobileNetV3-Small Transfer Learning Training Configuration
experiment:
  name: mobilenet_v3_small_training
  version: v1
  description: MobileNetV3-Small transfer learning on FER2013 grayscale dataset

model:
  name: mobilenet_v3_small

data:
  raw_path: data/raw/fer2013/fer2013.csv
  batch_size: 64
  num_workers: 0
  pin_memory: false

training:
  epochs: 15
  batch_size: 64

  optimizer:
    name: adamw
    learning_rate: 0.0005
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

  loss:
    name: cross_entropy
    class_weighted: false

  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 2
    min_lr: 1.0e-6

  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 5
    min_delta: 0.001

  checkpoint:
    save_best: true
    save_last: true
    monitor: val_loss
    mode: min
    save_dir: artifacts/training/mobilenet_v3_small

  mixed_precision:
    enabled: false

  gradient_clipping:
    enabled: true
    max_norm: 1.0

reproducibility:
  seed: 42
  deterministic: true
