version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: emotion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emotion_detection}
      POSTGRES_USER: ${POSTGRES_USER:-emotion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emotion_user} -d ${POSTGRES_DB:-emotion_detection}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - emotion-network

  redis:
    image: redis:7-alpine
    container_name: emotion-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - emotion-network

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: emotion-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-emotion_detection}
      - POSTGRES_USER=${POSTGRES_USER:-emotion_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-emotion_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-emotion_detection}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emotion-network

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: emotion-worker
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion-network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: emotion-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - api
    networks:
      - emotion-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  emotion-network:
    driver: bridge
